name: web deploy (GitHub Pages)

# يبني ويفحص وينشر web/dist إلى GitHub Pages — يحتاج تفعيل يدوي بإعدادات
# المستودع أولاً: Settings → Pages → Build and deployment → Source →
# "GitHub Actions" (حالياً على "Deploy from a branch"، يخدم الملفات
# القديمة بجذر المستودع مباشرة). هذا التبديل قرار بشري، موثّق بـ web/README.md
on:
  push:
    branches: [master]
    paths: ['web/**', '.github/workflows/web-deploy.yml']
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
