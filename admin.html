<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>لوحة إدارة الشركات — حساباتي</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
:root{
  --bg:#040d1a; --bg2:#071428; --bg3:#0d1f3c; --bg4:#122a50;
  --accent:#22d3ee; --accent2:#0891b2;
  --gold:#fbbf24;
  --text:#e0f2fe; --text2:#7dd3fc; --text-dim:rgba(186,230,253,.4);
  --border:rgba(34,211,238,.15); --border2:rgba(34,211,238,.32);
  --red:#fb7185; --green:#4ade80;
}
*{box-sizing:border-box;}
body{margin:0;background:var(--bg);color:var(--text);font-family:'Cairo',sans-serif;direction:rtl;min-height:100vh;}
input,select{font-family:'Cairo',sans-serif;}
.wrap{max-width:560px;margin:0 auto;padding:16px;padding-bottom:60px;}

/* ── تسجيل الدخول ── */
#loginView{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;}
.login-card{width:100%;max-width:360px;background:var(--bg2);border:1px solid var(--border2);border-radius:16px;padding:26px 22px;text-align:center;}
.login-logo{font-size:20px;font-weight:900;color:var(--accent);margin-bottom:4px;}
.login-sub{color:var(--text-dim);font-size:13px;margin-bottom:20px;}
.login-lbl{color:var(--text-dim);font-size:11px;font-weight:700;text-align:right;margin-bottom:5px;}
.login-input{width:100%;background:var(--bg3);border:1.5px solid var(--border2);border-radius:8px;padding:11px 12px;color:var(--text);font-size:14px;direction:ltr;text-align:left;margin-bottom:12px;}
.login-btn{width:100%;padding:12px;border-radius:9px;font-family:'Cairo',sans-serif;font-size:14px;font-weight:900;background:var(--accent2);border:none;color:white;cursor:pointer;}
.login-btn:disabled{opacity:.6;}
.login-err{color:var(--red);font-size:12px;margin-top:10px;min-height:14px;}

/* ── الداشبورد ── */
#dashView{display:none;}
.dash-header{position:sticky;top:0;z-index:10;background:linear-gradient(135deg,#040d1a,#071e38);padding:14px 16px;display:flex;align-items:center;justify-content:space-between;box-shadow:0 2px 8px rgba(0,0,0,.4);}
.dash-title{font-size:16px;font-weight:900;color:var(--accent);}
.btn-sm{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.25);border-radius:6px;color:var(--text);padding:6px 12px;font-family:'Cairo',sans-serif;font-size:12px;cursor:pointer;}

.stats-row{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px;}
.stat-box{background:var(--bg2);border:1px solid var(--border);border-radius:10px;padding:10px 4px;text-align:center;}
.stat-num{font-size:19px;font-weight:900;}
.stat-lbl{font-size:9.5px;color:var(--text-dim);margin-top:2px;}

.section-lbl{color:var(--accent);font-size:13px;font-weight:900;margin:16px 0 10px;display:flex;align-items:center;justify-content:space-between;}

/* ── نموذج إنشاء شركة (قابل للطي) ── */
#createPanel{display:none;background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:14px;margin-bottom:16px;}
.f-lbl{color:var(--text-dim);font-size:11px;font-weight:700;text-align:right;margin-bottom:5px;}
.f-input{width:100%;background:var(--bg3);border:1.5px solid var(--border2);border-radius:7px;padding:9px 12px;color:var(--text);font-size:13.5px;margin-bottom:12px;}
.f-input.ltr{direction:ltr;text-align:left;}
.pw-row{position:relative;}
.pw-row .f-input{padding-left:40px;}
.pw-toggle{position:absolute;left:8px;top:8px;background:none;border:none;color:var(--text-dim);font-size:13px;cursor:pointer;padding:4px;}
.pw-hint{font-size:10.5px;margin-top:-8px;margin-bottom:12px;text-align:right;}
.pw-hint.ok{color:var(--green);}
.pw-hint.bad{color:var(--text-dim);}
.plan-row{display:flex;gap:8px;margin-bottom:14px;}
.plan-opt{flex:1;padding:10px 6px;border-radius:8px;border:1.5px solid var(--border2);background:var(--bg3);color:var(--text-dim);text-align:center;font-size:12.5px;font-weight:700;cursor:pointer;}
.plan-opt.sel{border-color:var(--gold);color:var(--gold);background:rgba(251,191,36,.1);}
.f-btn{width:100%;padding:11px;border-radius:8px;font-family:'Cairo',sans-serif;font-size:13.5px;font-weight:900;background:var(--accent2);border:none;color:white;cursor:pointer;}
.f-btn:disabled{opacity:.6;}
.f-err{color:var(--red);font-size:12px;text-align:center;margin-top:8px;min-height:14px;}

.filter-row{display:flex;gap:8px;margin-bottom:14px;}
.search-input{flex:1;background:var(--bg2);border:1.5px solid var(--border2);border-radius:9px;padding:10px 14px;color:var(--text);font-size:13px;}
.sort-select{background:var(--bg2);border:1.5px solid var(--border2);border-radius:9px;padding:10px 8px;color:var(--text);font-size:12.5px;}

.co-card{background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:14px;margin-bottom:10px;}
.co-card.overdue{border-color:rgba(251,113,133,.4);}
.co-top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px;}
.co-name{font-size:15px;font-weight:900;color:var(--text);}
.co-badge{font-size:10.5px;font-weight:800;padding:3px 10px;border-radius:20px;white-space:nowrap;}
.co-badge.on{background:rgba(74,222,128,.15);color:var(--green);}
.co-badge.off{background:rgba(251,113,133,.15);color:var(--red);}
.co-badge.trial{background:rgba(251,191,36,.15);color:var(--gold);}
.co-email{font-size:12px;color:var(--text-dim);direction:ltr;text-align:right;margin-bottom:10px;}
.co-dates{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px;}
.co-date-box{background:var(--bg3);border-radius:7px;padding:7px 9px;}
.co-date-lbl{font-size:9.5px;color:var(--text-dim);margin-bottom:2px;}
.co-date-val{font-size:12.5px;font-weight:700;direction:ltr;text-align:right;}
.co-date-val.due{color:var(--red);}
.co-reason{font-size:11.5px;color:var(--red);background:rgba(251,113,133,.08);border-radius:6px;padding:7px 9px;margin-bottom:10px;}
.co-actions{display:flex;gap:6px;}
.co-btn{flex:1;padding:9px 4px;border-radius:7px;font-family:'Cairo',sans-serif;font-size:11.5px;font-weight:800;cursor:pointer;border:1.5px solid var(--border2);background:var(--bg3);color:var(--text2);}
.co-btn.pay{background:rgba(74,222,128,.18);border-color:#40c060;color:var(--green);}
.co-btn.danger{background:rgba(251,113,133,.15);border-color:#cc4444;color:var(--red);}

.empty{text-align:center;color:var(--text-dim);font-size:13px;padding:30px 10px;}

/* ── نافذة منبثقة داخل الصفحة (بدل prompt/confirm/alert المتصفح —
     بعض متصفحات الموبايل، خصوصاً داخل تطبيقات ثانية، تحجبها أو تعرضها فاضية) ── */
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:100;align-items:flex-end;justify-content:center;}
.modal-box{width:100%;max-width:420px;background:var(--bg2);border:1px solid var(--border2);border-radius:16px 16px 0 0;padding:20px;}
@media (min-width:480px){
  .modal-overlay{align-items:center;}
  .modal-box{border-radius:16px;}
}
.modal-title{font-size:15px;font-weight:900;color:var(--accent);margin-bottom:8px;}
.modal-msg{font-size:12.5px;color:var(--text-dim);margin-bottom:14px;line-height:1.6;}
.modal-actions{display:flex;gap:8px;margin-top:6px;}
.modal-btn{flex:1;padding:11px;border-radius:9px;font-family:'Cairo',sans-serif;font-size:13.5px;font-weight:800;cursor:pointer;border:1.5px solid var(--border2);background:var(--bg3);color:var(--text2);}
.modal-btn.primary{background:var(--accent2);border-color:var(--accent2);color:white;}

/* ── توست خفيف بدل alert() ── */
#toastBox{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);z-index:200;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;}
.toast{background:var(--bg4);border:1px solid var(--border2);border-radius:10px;padding:10px 18px;font-size:13px;font-weight:700;box-shadow:0 4px 16px rgba(0,0,0,.4);max-width:90vw;text-align:center;}
.toast.err{border-color:rgba(251,113,133,.5);color:var(--red);}
.toast.ok{border-color:rgba(74,222,128,.5);color:var(--green);}
</style>
</head>
<body>

<div id="loginView">
  <div class="login-card">
    <div class="login-logo">لوحة إدارة الشركات</div>
    <div class="login-sub">دخول مالك النظام فقط</div>
    <div class="login-lbl">البريد الإلكتروني</div>
    <input type="email" id="loginEmail" class="login-input" autocomplete="username" placeholder="you@example.com">
    <div class="login-lbl">كلمة المرور</div>
    <input type="password" id="loginPassword" class="login-input" autocomplete="current-password" placeholder="••••••••" onkeydown="if(event.key==='Enter') doLogin();">
    <button id="btnLogin" class="login-btn" onclick="doLogin()">دخول</button>
    <div id="loginErr" class="login-err"></div>
  </div>
</div>

<div id="dashView">
  <div class="dash-header">
    <button class="btn-sm" onclick="doLogout()">🚪 خروج</button>
    <div class="dash-title">🏢 إدارة الشركات</div>
    <button class="btn-sm" onclick="loadCompanies()">🔄</button>
  </div>
  <div class="wrap">
    <div class="stats-row">
      <div class="stat-box"><div class="stat-num" id="statTotal" style="color:var(--accent);">—</div><div class="stat-lbl">الكل</div></div>
      <div class="stat-box"><div class="stat-num" id="statActive" style="color:var(--green);">—</div><div class="stat-lbl">فعّالة</div></div>
      <div class="stat-box"><div class="stat-num" id="statTrial" style="color:var(--gold);">—</div><div class="stat-lbl">تجريبي</div></div>
      <div class="stat-box"><div class="stat-num" id="statDue" style="color:var(--red);">—</div><div class="stat-lbl">موقوفة/متأخرة</div></div>
    </div>

    <div class="section-lbl">
      <span>الشركات</span>
      <button class="btn-sm" onclick="toggleCreatePanel()">➕ شركة جديدة</button>
    </div>

    <div id="createPanel">
      <div class="f-lbl">اسم الشركة</div>
      <input type="text" id="cName" class="f-input" placeholder="مثال: صيرفة الأمانة">
      <div class="f-lbl">الإيميل</div>
      <input type="email" id="cEmail" class="f-input ltr" placeholder="owner@example.com">
      <div class="f-lbl">كلمة المرور (تختارها أنت — 6 أحرف على الأقل)</div>
      <div class="pw-row">
        <input type="password" id="cPassword" class="f-input ltr" placeholder="كلمة المرور" oninput="updatePwHint()">
        <button type="button" class="pw-toggle" onclick="togglePwVisibility()" id="pwToggleBtn">👁️</button>
      </div>
      <div class="pw-hint bad" id="pwHint">لسا ما كتبت كلمة مرور</div>
      <div class="f-lbl">نوع الاشتراك</div>
      <div class="plan-row">
        <div class="plan-opt sel" id="planTrialBtn" onclick="selectPlan('trial')">🟡 تجريبي (7 أيام مجاناً)</div>
        <div class="plan-opt" id="planPaidBtn" onclick="selectPlan('paid')">💳 مدفوع (3 أشهر)</div>
      </div>
      <button class="f-btn" onclick="createCompany()" id="btnCreate">➕ إنشاء الحساب</button>
      <div class="f-err" id="createErr"></div>
    </div>

    <div class="filter-row">
      <input type="text" id="searchInput" class="search-input" placeholder="🔍 دوّر باسم الشركة أو الإيميل..." oninput="renderCompanies()">
      <select id="sortSelect" class="sort-select" onchange="renderCompanies()">
        <option value="due">الأقرب استحقاقاً</option>
        <option value="new">الأحدث تسجيلاً</option>
        <option value="old">الأقدم تسجيلاً</option>
        <option value="name">الاسم (أبجدي)</option>
      </select>
    </div>

    <div id="companyList"><div class="empty">⏳ جاري التحميل...</div></div>
  </div>
</div>

<!-- نافذة منبثقة عامة (تأكيد / إدخال نص) -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal-box">
    <div class="modal-title" id="modalTitle"></div>
    <div class="modal-msg" id="modalMsg"></div>
    <input type="text" id="modalInput" class="f-input ltr" style="display:none;">
    <div class="modal-actions">
      <button class="modal-btn" id="modalCancelBtn">إلغاء</button>
      <button class="modal-btn primary" id="modalOkBtn">تأكيد</button>
    </div>
  </div>
</div>

<div id="toastBox"></div>

<script>
const SB_URL = 'https://qycglhyqjzztzjiilsku.supabase.co';
const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InF5Y2dsaHlxanp6dHpqaWlsc2t1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQ5NDg3MTEsImV4cCI6MjA5MDUyNDcxMX0.fIvwt6zus0am_KjgMZC-JpwVB_5YkNRZN7qs6HDicPk';
const sb = supabase.createClient(SB_URL, SB_KEY, { auth: { persistSession: true, autoRefreshToken: true } });

function escapeHtml(str){
  return String(str ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function fmtDate(iso){
  if(!iso) return '—';
  const d = new Date(iso);
  return d.toLocaleDateString('ar-IQ', { year:'numeric', month:'2-digit', day:'2-digit' });
}

// ── توست خفيف بدل alert() ──
function toast(msg, type){
  const box = document.getElementById('toastBox');
  const el = document.createElement('div');
  el.className = 'toast' + (type ? ' ' + type : '');
  el.textContent = msg;
  box.appendChild(el);
  setTimeout(() => el.remove(), 3200);
}

// ── نافذة منبثقة عامة: تأكيد بس (withInput:false) أو تأكيد + إدخال نص ──
function showModal({ title, msg, withInput, placeholder, okLabel }){
  return new Promise(resolve => {
    document.getElementById('modalTitle').textContent = title || '';
    document.getElementById('modalMsg').textContent = msg || '';
    const inputEl = document.getElementById('modalInput');
    const okBtn = document.getElementById('modalOkBtn');
    const cancelBtn = document.getElementById('modalCancelBtn');
    inputEl.style.display = withInput ? 'block' : 'none';
    inputEl.value = '';
    inputEl.placeholder = placeholder || '';
    inputEl.type = 'text';
    okBtn.textContent = okLabel || 'تأكيد';
    document.getElementById('modalOverlay').style.display = 'flex';
    if(withInput) setTimeout(() => inputEl.focus(), 60);

    function cleanup(){
      document.getElementById('modalOverlay').style.display = 'none';
      okBtn.onclick = null; cancelBtn.onclick = null; inputEl.onkeydown = null;
    }
    okBtn.onclick = () => { const v = withInput ? inputEl.value : true; cleanup(); resolve(v); };
    cancelBtn.onclick = () => { cleanup(); resolve(null); };
    if(withInput) inputEl.onkeydown = (e) => { if(e.key === 'Enter') okBtn.onclick(); };
  });
}

async function doLogin(){
  const email = document.getElementById('loginEmail').value.trim();
  const password = document.getElementById('loginPassword').value;
  const errEl = document.getElementById('loginErr');
  const btn = document.getElementById('btnLogin');
  errEl.textContent = '';
  if(!email || !password){ errEl.textContent = 'أدخل الإيميل وكلمة المرور'; return; }
  btn.disabled = true; btn.textContent = '⏳ جاري الدخول...';
  try {
    const { error } = await sb.auth.signInWithPassword({ email, password });
    if(error) throw new Error('❌ بيانات الدخول غير صحيحة');
  } catch(e){
    errEl.textContent = e.message;
  } finally {
    btn.disabled = false; btn.textContent = 'دخول';
  }
}

function doLogout(){ sb.auth.signOut(); }

async function checkOwnerAndEnter(session){
  if(session.user.app_metadata?.is_owner !== true){
    document.getElementById('loginErr').textContent = '❌ هذا الحساب ما عنده صلاحية دخول لوحة الإدارة';
    await sb.auth.signOut();
    return;
  }
  document.getElementById('loginView').style.display = 'none';
  document.getElementById('dashView').style.display = 'block';
  loadCompanies();
}

function showLogin(){
  document.getElementById('dashView').style.display = 'none';
  document.getElementById('loginView').style.display = 'flex';
  document.getElementById('loginPassword').value = '';
}

sb.auth.onAuthStateChange((event, session) => {
  if(session) checkOwnerAndEnter(session); else showLogin();
});

// ── إنشاء شركة جديدة ──
let selectedPlan = 'trial';
function selectPlan(p){
  selectedPlan = p;
  document.getElementById('planTrialBtn').classList.toggle('sel', p==='trial');
  document.getElementById('planPaidBtn').classList.toggle('sel', p==='paid');
}
function toggleCreatePanel(){
  const el = document.getElementById('createPanel');
  el.style.display = el.style.display === 'block' ? 'none' : 'block';
}
function togglePwVisibility(){
  const inp = document.getElementById('cPassword');
  const btn = document.getElementById('pwToggleBtn');
  const show = inp.type === 'password';
  inp.type = show ? 'text' : 'password';
  btn.textContent = show ? '🙈' : '👁️';
}
function updatePwHint(){
  const len = document.getElementById('cPassword').value.length;
  const hint = document.getElementById('pwHint');
  if(len === 0){ hint.textContent = 'لسا ما كتبت كلمة مرور'; hint.className = 'pw-hint bad'; }
  else if(len < 6){ hint.textContent = `${len}/6 أحرف — لسا ناقص`; hint.className = 'pw-hint bad'; }
  else { hint.textContent = `✓ ${len} أحرف — تمام`; hint.className = 'pw-hint ok'; }
}

async function extractErr(error){
  let msg = error.message;
  if(error.context && typeof error.context.json === 'function'){
    try { const body = await error.context.json(); if(body?.error) msg = body.error; } catch(_){}
  }
  return msg;
}

async function createCompany(){
  const name = document.getElementById('cName').value.trim();
  const email = document.getElementById('cEmail').value.trim();
  const password = document.getElementById('cPassword').value;
  const errEl = document.getElementById('createErr');
  const btn = document.getElementById('btnCreate');
  errEl.textContent = '';
  if(!name || !email || !password){ errEl.textContent = 'عبّي كل الحقول'; return; }
  if(password.length < 6){ errEl.textContent = 'كلمة المرور لازم 6 أحرف على الأقل'; return; }

  btn.disabled = true; btn.textContent = '⏳ جاري الإنشاء...';
  try {
    const { data, error } = await sb.functions.invoke('admin-create-tenant', {
      body: { business_name: name, email, password, plan: selectedPlan }
    });
    if(error) throw new Error(await extractErr(error));
    if(data?.error) throw new Error(data.error);

    await showModal({
      title: `✅ تم إنشاء حساب "${name}"`,
      msg: `الإيميل: ${data.email}\nكلمة المرور: ${data.password}\n\nخذ نسخة من كلمة المرور هذي — ما راح تظهر مرة ثانية.`,
      okLabel: 'تمام',
    });
    document.getElementById('cName').value = '';
    document.getElementById('cEmail').value = '';
    document.getElementById('cPassword').value = '';
    updatePwHint();
    toggleCreatePanel();
    loadCompanies();
  } catch(e){
    errEl.textContent = '❌ ' + e.message;
  } finally {
    btn.disabled = false; btn.textContent = '➕ إنشاء الحساب';
  }
}

// ── الشركات ──
let COMPANIES = [];

function dueDateOf(c){ return new Date(c.next_due_at); }

function statusOf(c){
  const now = new Date();
  const due = dueDateOf(c);
  if(c.suspended) return { cls:'off', label:'⛔ موقوفة', overdue:true };
  if(due < now) return { cls:'off', label: c.plan==='trial' ? '🔴 انتهت التجربة' : '🔴 متأخرة الدفع', overdue:true };
  if(c.plan==='trial') return { cls:'trial', label:'🟡 تجريبي', overdue:false };
  return { cls:'on', label:'🟢 فعّالة', overdue:false };
}

async function loadCompanies(){
  const listEl = document.getElementById('companyList');
  listEl.innerHTML = '<div class="empty">⏳ جاري التحميل...</div>';
  try {
    const { data, error } = await sb.functions.invoke('admin-create-tenant', { body: { action: 'list' } });
    if(error) throw new Error(await extractErr(error));
    if(data?.error) throw new Error(data.error);
    COMPANIES = data.companies || [];
    renderStats();
    renderCompanies();
  } catch(e){
    listEl.innerHTML = `<div class="empty" style="color:var(--red);">❌ ${escapeHtml(e.message)}</div>`;
  }
}

function renderStats(){
  const active = COMPANIES.filter(c => statusOf(c).cls === 'on').length;
  const trial  = COMPANIES.filter(c => statusOf(c).cls === 'trial').length;
  const down   = COMPANIES.filter(c => statusOf(c).overdue).length;
  document.getElementById('statTotal').textContent = COMPANIES.length;
  document.getElementById('statActive').textContent = active;
  document.getElementById('statTrial').textContent = trial;
  document.getElementById('statDue').textContent = down;
}

function renderCompanies(){
  const listEl = document.getElementById('companyList');
  const q = (document.getElementById('searchInput').value || '').trim().toLowerCase();
  const sortBy = document.getElementById('sortSelect').value;

  let filtered = COMPANIES.filter(c =>
    !q || (c.name||'').toLowerCase().includes(q) || (c.email||'').toLowerCase().includes(q)
  );

  filtered = filtered.slice().sort((a,b) => {
    if(sortBy === 'name') return (a.name||'').localeCompare(b.name||'', 'ar');
    if(sortBy === 'new')  return new Date(b.created_at) - new Date(a.created_at);
    if(sortBy === 'old')  return new Date(a.created_at) - new Date(b.created_at);
    return dueDateOf(a) - dueDateOf(b); // due — الأقرب استحقاقاً أولاً
  });

  if(!filtered.length){
    listEl.innerHTML = '<div class="empty">لا يوجد نتائج</div>';
    return;
  }
  listEl.innerHTML = filtered.map(c => {
    const st = statusOf(c);
    return `
    <div class="co-card ${st.overdue?'overdue':''}">
      <div class="co-top">
        <span class="co-badge ${st.cls}">${st.label}</span>
        <span class="co-name">${escapeHtml(c.name||'—')}</span>
      </div>
      <div class="co-email">${escapeHtml(c.email||'—')}</div>
      <div class="co-dates">
        <div class="co-date-box"><div class="co-date-lbl">تاريخ التسجيل</div><div class="co-date-val">${fmtDate(c.created_at)}</div></div>
        <div class="co-date-box"><div class="co-date-lbl">الدفعة القادمة</div><div class="co-date-val ${st.overdue && !c.suspended ?'due':''}">${fmtDate(c.next_due_at)}</div></div>
      </div>
      ${c.suspended && c.suspend_reason ? `<div class="co-reason">السبب: ${escapeHtml(c.suspend_reason)}</div>` : ''}
      <div class="co-actions">
        <button class="co-btn pay" onclick="markPaid('${escapeHtml(c.email)}')">✅ تسديد الدفعة</button>
        ${!c.suspended ? `<button class="co-btn danger" onclick="suspendCompany('${escapeHtml(c.email)}')">⏸️ تعليق</button>` : ''}
        <button class="co-btn" onclick="resetPassword('${escapeHtml(c.email)}')">🔑 كلمة مرور</button>
      </div>
    </div>`;
  }).join('');
}

async function markPaid(email){
  const ok = await showModal({
    title: 'تأكيد تسديد الدفعة',
    msg: `${email}\nيجدد الاشتراك 3 أشهر ويفعّل الشركة تلقائياً.`,
  });
  if(!ok) return;
  try {
    const { data, error } = await sb.functions.invoke('admin-create-tenant', { body: { action: 'mark_paid', email } });
    if(error) throw new Error(await extractErr(error));
    if(data?.error) throw new Error(data.error);
    toast('✅ تم تسجيل الدفعة', 'ok');
    loadCompanies();
  } catch(e){
    toast('❌ ' + e.message, 'err');
  }
}

async function suspendCompany(email){
  const reason = await showModal({
    title: 'تعليق اشتراك',
    msg: `${email}\nسبب التعليق؟ يظهر لهم عند تسجيل الدخول.`,
    withInput: true,
    placeholder: 'مثال: لم يتم تسديد اشتراك هذا الشهر',
    okLabel: '⏸️ تعليق',
  });
  if(reason === null) return;
  try {
    const { data, error } = await sb.functions.invoke('admin-create-tenant', { body: { action: 'toggle_suspension', email, suspended: true, reason } });
    if(error) throw new Error(await extractErr(error));
    if(data?.error) throw new Error(data.error);
    toast('⏸️ تم تعليق الشركة', 'ok');
    loadCompanies();
  } catch(e){
    toast('❌ ' + e.message, 'err');
  }
}

async function resetPassword(email){
  const pw = await showModal({
    title: 'كلمة مرور جديدة',
    msg: `${email}\nاكتب كلمة المرور الجديدة (6 أحرف على الأقل).`,
    withInput: true,
    placeholder: 'كلمة المرور الجديدة',
    okLabel: '🔑 تغيير',
  });
  if(pw === null) return;
  if(pw.length < 6){ toast('❌ كلمة المرور لازم 6 أحرف على الأقل', 'err'); return; }
  try {
    const { data, error } = await sb.functions.invoke('admin-create-tenant', { body: { action: 'reset_password', email, password: pw } });
    if(error) throw new Error(await extractErr(error));
    if(data?.error) throw new Error(data.error);
    toast(`✅ تم تغيير كلمة المرور لـ ${data.email}`, 'ok');
  } catch(e){
    toast('❌ ' + e.message, 'err');
  }
}
</script>
</body>
</html>
